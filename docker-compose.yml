version: "3.8"

services:
  app-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend-app-1
    environment:
      - INSTANCE_ID=backend-instance-alpha
    restart: unless-stopped
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  app-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend-app-2
    environment:
      - INSTANCE_ID=backend-instance-beta
    restart: unless-stopped
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  load-balancer:
    image: nginx:alpine
    container_name: nginx-load-balancer
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app-1
      - app-2
    restart: unless-stopped
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
