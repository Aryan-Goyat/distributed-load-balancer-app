events {
    worker_connections 1024;
}

http {
    upstream backend_cluster {
        # Round-robin load balancing across backend instances
        server app-1:8000 max_fails=3 fail_timeout=10s;
        server app-2:8000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name localhost;

        # Health check for the load balancer itself
        location /lb-health {
            default_type application/json;
            return 200 '{"load_balancer": "active", "algorithm": "round-robin", "cluster": "backend_cluster"}';
        }

        # Proxy all traffic to the backend cluster
        location / {
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Expose which upstream server handled the request
            add_header X-Handled-By $upstream_addr always;

            # Failover logic: if one instance is down, immediately try the next
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
        }
    }
}
